# CI for the orc zk-TLS PoC.
#
# Deliberately NOT built here: the SP1 guest (program/) and its host
# (crates/orc-script). They need the SP1 toolchain, the riscv64 C toolchain,
# protoc + libprotobuf-dev and several GB of build artifacts; that is too heavy
# for CI runners. Build, clippy and check them in the Docker dev env (see
# README), and compare `orc-script vkey` against the documented production vkey.
# Only their formatting is checked here (rustfmt needs no build).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: fmt + clippy + test (root workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # No submodules: they only hold Solidity libraries (contracts/lib).
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Same Rust as the dev image (docker/Dockerfile, rust:1.99.1-trixie),
      # plus the same rustfmt/clippy components it adds.
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy

      # Default rustfmt config (no rustfmt.toml). Formatting the guest's code
      # (program/, crates/orc-core) can change the ELF and so the program vkey:
      # panic locations (file:line:col) are compiled in.
      - name: cargo fmt --all --check
        run: cargo fmt --all --check

      # program/ and crates/orc-script are separate workspaces (see above);
      # plain rustfmt follows their `mod` trees without resolving their deps.
      - name: rustfmt --check (program, orc-script)
        run: >-
          rustfmt --check --edition 2024
          program/src/main.rs crates/orc-script/build.rs crates/orc-script/src/main.rs

      - uses: Swatinem/rust-cache@v2

      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # No system packages needed: the root workspace's only native build
      # dependency is ring (C, built with the runner's cc). protoc and
      # libprotobuf-dev are only needed by sp1-sdk, i.e. crates/orc-script,
      # which is a separate workspace. Verified in a clean rust:1.99.1-trixie
      # container without protoc or clang, capped at 4 CPUs / 16 GB.
      #
      # Everything but orc-prover, in parallel. orc-prover's e2e suite runs
      # real MPC sessions and gets its own step below.
      - name: cargo test --workspace --exclude orc-prover --locked
        run: cargo test --workspace --exclude orc-prover --locked

      # The e2e tests run real MPC-TLS sessions between the prover and the
      # notary against a local TLS server with tlsn's test CA. They are
      # offline and need no secrets. The real-GitHub fixture test skips itself
      # when fixtures/github-graphql-200.bin is absent.
      #
      # Serialized (one test thread, one MPC session at a time). tlsn alpha.15
      # stalls in MPC setup in roughly 1 of 3 sessions on 4 CPUs (README,
      # "Known issues"); stalls look independent across retries. So more,
      # shorter attempts than the harness defaults (3 x 45 s): a healthy
      # phase takes <= 1.4 s on 4 CPUs, a stalled one never recovers, and
      # 0.33^8 per test keeps a spurious failure well under 1% of runs.
      # The harness prints the prover's and the notary's log tails for every
      # failed attempt, even when a retry then passes; the full logs are
      # uploaded in the next step.
      - name: cargo test -p orc-prover (MPC e2e, serialized)
        timeout-minutes: 25
        env:
          ORC_TEST_MPC_SLOTS: "1"
          ORC_TEST_ATTEMPTS: "8"
          ORC_TEST_PHASE_TIMEOUT_SECS: "15"
          ORC_TEST_LOG_DIR: ${{ runner.temp }}/orc-e2e-logs
        run: cargo test -p orc-prover --locked -- --test-threads=1

      # Only exists if an MPC session attempt failed.
      - name: Upload MPC e2e diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: orc-e2e-mpc-diagnostics
          path: ${{ runner.temp }}/orc-e2e-logs
          if-no-files-found: ignore
          retention-days: 14

  contracts:
    name: forge fmt + build + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      # Same Foundry as the dev image (docker/Dockerfile FOUNDRY_VERSION).
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.7

      # [fmt] settings live in contracts/foundry.toml (line_length 100).
      - name: forge fmt --check
        run: forge fmt --check

      - name: forge build
        run: forge build

      - name: forge test
        run: forge test -vv
