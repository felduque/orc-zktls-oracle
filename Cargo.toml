# Host workspace for the orc zk-TLS PoC.
#
# - crates/orc-core    guest-safe claim verification (also compiled into the SP1 guest)
# - crates/orc-notary  TCP notary (tlsn Verifier + k256 attestation signer)
# - crates/orc-prover  `orc` CLI: preflight, MPC-TLS to api.github.com, presentation
#
# `program/` (SP1 guest) and `crates/orc-script` (SP1 host) have their own
# workspaces and lockfiles, so `cargo test --workspace` here never compiles
# sp1-sdk or the guest; the spikes are standalone and frozen.
[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["program", "spikes", "crates/orc-script"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# TLSNotary: pinned git tag (not on crates.io). Same crates/features as spike m0b,
# plus the core/attestation crates orc-core uses without pulling in MPC.
tlsn = { git = "https://github.com/tlsnotary/tlsn", tag = "v0.1.0-alpha.15", features = ["mozilla-certs"] }
tlsn-core = { git = "https://github.com/tlsnotary/tlsn", tag = "v0.1.0-alpha.15" }
tlsn-attestation = { git = "https://github.com/tlsnotary/tlsn", tag = "v0.1.0-alpha.15" }
tlsn-formats = { git = "https://github.com/tlsnotary/tlsn", tag = "v0.1.0-alpha.15" }
tlsn-server-fixture-certs = { git = "https://github.com/tlsnotary/tlsn", tag = "v0.1.0-alpha.15" }

orc-core = { path = "crates/orc-core" }
orc-notary = { path = "crates/orc-notary" }
orc-prover = { path = "crates/orc-prover" }

alloy-primitives = { version = "1", features = ["serde"] }
alloy-sol-types = "1"
anyhow = "1.0"
bincode = "1.3"
clap = { version = "4.5", features = ["derive", "env"] }
futures = "0.3"
hex = "0.4"
http-body-util = "0.1"
httparse = "1.8"
hyper = { version = "1.1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rangeset = "0.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tiny-keccak = { version = "2.0", features = ["keccak"] }
tokio = { version = "1.38", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7", features = ["compat"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# MPC-TLS (garbled circuits) is unusably slow unoptimized. Optimize every
# dependency in dev/test builds so `cargo test` runs real sessions in seconds;
# workspace crates stay at opt-level 0 for fast rebuilds and debuggability.
[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
debug = false
