[package]
name = "m0a-script"
version = "0.0.0"
edition = "2024"
publish = false
default-run = "m0a-script"

# Standalone: do not join any parent workspace.
[workspace]

[dependencies]
sp1-sdk = { version = "6.10.0", features = ["blocking", "native-gnark"] }
m0a-lib = { path = "../lib" }
anyhow = "1.0"
hex = "0.4"

[features]
# SP1 v6 only honours `cycle-tracker-report-*` guest markers with sp1-sdk's
# `profiling` feature (sp1-core-executor src/minimal/write.rs).
profiling = ["sp1-sdk/profiling"]

[build-dependencies]
sp1-build = "6.10.0"
