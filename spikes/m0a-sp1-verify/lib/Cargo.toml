[package]
name = "m0a-lib"
version = "0.0.0"
edition = "2024"
publish = false

# Shared by the SP1 guest (program/) and the native baseline test (script/), so
# both run exactly the same verification code. No sp1 dependencies here.

[dependencies]
tlsn-attestation = { git = "https://github.com/tlsnotary/tlsn", tag = "v0.1.0-alpha.15" }
tlsn-core = { git = "https://github.com/tlsnotary/tlsn", tag = "v0.1.0-alpha.15" }
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
