[package]
name = "m0a-program"
version = "0.0.0"
edition = "2024"
publish = false

# Own workspace + Cargo.lock: the guest resolves with the sp1 patches below,
# independently of the host-side script.
[workspace]

[dependencies]
sp1-zkvm = "6.10.0"
m0a-lib = { path = "../lib" }
# Same tlsn crates m0a-lib uses, listed here so the guest's direct deps are explicit.
tlsn-attestation = { git = "https://github.com/tlsnotary/tlsn", tag = "v0.1.0-alpha.15" }
tlsn-core = { git = "https://github.com/tlsnotary/tlsn", tag = "v0.1.0-alpha.15" }
bincode = "1.3"

# SP1 precompile patches (sp1 v6.10.0). Check they are used with
# `cargo tree -i sha2` etc. (the source should be the sp1-patches git repo).
[patch.crates-io]
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha2", tag = "patch-sha2-0.10.9-sp1-6.10.0" }
k256 = { git = "https://github.com/sp1-patches/elliptic-curves", tag = "patch-k256-13.4-sp1-6.10.0" }
p256 = { git = "https://github.com/sp1-patches/elliptic-curves", tag = "patch-p256-13.2-sp1-6.10.0" }
tiny-keccak = { git = "https://github.com/sp1-patches/tiny-keccak", tag = "patch-2.0.2-sp1-6.10.0" }

[profile.release]
# Fewer cycles; the guest is tiny so build time is not a concern.
codegen-units = 1
lto = "fat"
